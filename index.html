<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2 Player Arcade Hub 🎮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    :root {
      --bg-body: #0f172a;
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
      --header-bg: #1e1b4b;
      --p1-red: #ff3b30;
      --p2-blue: #007aff;
      --green-btn: #34c759;
      --accent-gold: #ffcc00;
      --font-display: 'Fredoka', 'Outfit', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background: #0f172a;
      background-image: var(--bg-gradient);
      font-family: var(--font-display);
      color: #ffffff;
      overflow-x: hidden;
      touch-action: manipulation;
      position: relative;
    }

    /* AMBIENT FLOATING BACKGROUND ORBS */
    .bg-orbs-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.35;
      animation: floatOrb 12s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 260px;
      height: 260px;
      background: #6366f1;
      top: -40px;
      left: -50px;
      animation-duration: 14s;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: #ec4899;
      bottom: 100px;
      right: -80px;
      animation-duration: 18s;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 220px;
      height: 220px;
      background: #06b6d4;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 16s;
      animation-delay: -9s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 40px) scale(1.15); }
      100% { transform: translate(-20px, 20px) scale(0.9); }
    }

    #app {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 110px;
      position: relative;
      z-index: 1;
    }

    /* TOP HEADER BAR */
    .top-header-bar {
      width: 100%;
      max-width: 540px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 3px solid #000000;
      box-shadow: 0 4px 0 #000000;
      will-change: transform;
      transform: translateZ(0);
    }

    .icon-btn {
      min-width: 48px;
      min-height: 48px;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #334155, #1e293b);
      border: 3px solid #000000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #ffffff;
      box-shadow: 0 4px 0 #000000;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.94) translateY(3px);
      box-shadow: 0 2px 0 #000000;
    }

    .remove-ads-pill {
      min-height: 48px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: 3px solid #000000;
      border-radius: 24px;
      padding: 8px 20px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 #000000;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 4px 0 #000000; }
      100% { box-shadow: 0 4px 0 #000000; }
    }

    .remove-ads-pill:active {
      transform: scale(0.94) translateY(3px);
      box-shadow: 0 2px 0 #000000;
    }

    .country-flag-btn {
      min-width: 48px;
      min-height: 48px;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #334155, #1e293b);
      border: 3px solid #000000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 0 #000000;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .country-flag-btn:active {
      transform: scale(0.94) translateY(3px);
      box-shadow: 0 2px 0 #000000;
    }

    /* MAIN HUB CONTAINER */
    .hub-content {
      width: 100%;
      max-width: 540px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popModal {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* SEARCH & FILTER BAR */
    .search-filter-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .search-box {
      width: 100%;
      min-height: 52px;
      background: #1e293b;
      border: 3px solid #000000;
      border-radius: 24px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 0 #000000;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
    }

    .search-input::placeholder {
      color: #94a3b8;
    }

    .category-pills {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .category-pills::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      min-height: 48px;
      background: #1e293b;
      border: 3px solid #000000;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 800;
      color: #cbd5e1;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 4px 0 #000000;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cat-pill.active, .cat-pill:hover {
      background: #fbbf24;
      color: #000000;
      transform: translateY(-2px);
    }

    .cat-pill:active {
      transform: scale(0.94) translateY(3px);
      box-shadow: 0 2px 0 #000000;
    }

    /* 2-COLUMN TILES GRID */
    .tiles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    /* GAME TILE CARD - 3D NEUMORPHIC ARCADE ARCHITECTURE */
    .tile-card {
      width: 100%;
      aspect-ratio: 1;
      border: 3px solid #000000;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 0 #000000;
      text-decoration: none;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      animation: cardEntrance 0.5s ease-out backwards;
      min-height: 48px;
      will-change: transform;
      transform: translateZ(0);
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(20px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .tile-card:nth-child(1) { animation-delay: 0.05s; }
    .tile-card:nth-child(2) { animation-delay: 0.1s; }
    .tile-card:nth-child(3) { animation-delay: 0.15s; }
    .tile-card:nth-child(4) { animation-delay: 0.2s; }
    .tile-card:nth-child(5) { animation-delay: 0.25s; }
    .tile-card:nth-child(6) { animation-delay: 0.3s; }
    .tile-card:nth-child(7) { animation-delay: 0.35s; }
    .tile-card:nth-child(8) { animation-delay: 0.4s; }
    .tile-card:nth-child(9) { animation-delay: 0.45s; }
    .tile-card:nth-child(10) { animation-delay: 0.5s; }

    .tile-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 6px 0 #000000;
    }

    .tile-card:active {
      transform: scale(0.94) translateY(3px);
      box-shadow: 0 2px 0 #000000;
    }

    /* BADGE TAG OVERLAY */
    .tile-tag {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #ffffff;
      border-radius: 12px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 2;
      box-shadow: 0 2px 0 #000000;
    }

    /* Gradient Overlay for Readable Text */
    .tile-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 55%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Bold Uppercase Title */
    .tile-title {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      z-index: 2;
      position: relative;
      -webkit-text-stroke: 1.8px #000000;
      text-shadow: 0 3px 0 #000000, 0 0 10px rgba(0,0,0,0.8);
      word-break: break-word;
    }

    /* Vector Backgrounds */
    .tile-snake { background: radial-gradient(circle at center, #10b981 0%, #047857 100%); }
    .tile-memory { background: radial-gradient(circle at center, #854d0e 0%, #3a2b2b 100%); }
    .tile-emoji { background: radial-gradient(circle at center, #3b82f6 0%, #1d4ed8 100%); }
    .tile-carrom { background: radial-gradient(circle at center, #d97706 0%, #78350f 100%); }
    .tile-color { background: radial-gradient(circle at center, #ec4899 0%, #831843 100%); }
    .tile-dirt { background: radial-gradient(circle at center, #eab308 0%, #854d0e 100%); }

    .vector-art-illustration {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      z-index: 0;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }

    .tile-card:hover .vector-art-illustration {
      transform: scale(1.15) rotate(3deg);
    }

    /* BOTTOM TOURNAMENT & PLAYER FOOTER */
    .bottom-player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border-top: 3px solid #000000;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 -4px 0 #000000;
      will-change: transform;
      transform: translateZ(0);
    }

    .player-score-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 50%;
      border: 3px solid #000000;
      box-shadow: 0 4px 0 #000000;
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      position: relative;
      transition: transform 0.15s ease;
    }

    .badge-p1 { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .badge-p2 { background: linear-gradient(135deg, #3b82f6, #2563eb); }

    .player-avatar-icon {
      position: absolute;
      top: -10px;
      font-size: 16px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .tournament-btn {
      min-height: 48px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: 3px solid #000000;
      border-radius: 24px;
      padding: 12px 24px;
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 4px 0 #000000;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
    }

    .tournament-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #000000;
    }

    .tournament-btn:active {
      transform: scale(0.94) translateY(3px);
      box-shadow: 0 2px 0 #000000;
    }

    .tournament-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #000000;
    }

    .tournament-btn:active {
      transform: scale(0.94) translateY(3px);
      box-shadow: 0 2px 0 #000000;
    }
  </style>
</head>
<body>
  <!-- AMBIENT BACKGROUND ORBS -->
  <div class="bg-orbs-container">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
  </div>

  <div id="app">
    <!-- TOP HEADER BAR -->
    <header class="top-header-bar">
      <button class="icon-btn" onclick="toggleSound()" id="sound-btn" aria-label="Settings">⚙️</button>

      <div class="remove-ads-pill">
        <span>📢</span>
        <span>REMOVE ADS</span>
      </div>

      <div class="country-flag-btn">🇧🇩</div>
    </header>

    <!-- MAIN HUB CONTENT -->
    <main class="hub-content">
      <!-- SEARCH & CATEGORY FILTER -->
      <div class="search-filter-wrapper">
        <div class="search-box">
          <span style="font-size:18px;">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="Search 10 Arcade Games..." oninput="filterGames()">
        </div>
        <div class="category-pills">
          <button class="cat-pill active" onclick="selectCategory('all', this)">🔥 ALL</button>
          <button class="cat-pill" onclick="selectCategory('action', this)">⚡ ACTION</button>
          <button class="cat-pill" onclick="selectCategory('puzzle', this)">🧩 PUZZLE</button>
          <button class="cat-pill" onclick="selectCategory('arcade', this)">🎯 ARCADE</button>
        </div>
      </div>

      <!-- 2-COLUMN TILES GRID -->
      <div class="tiles-grid" id="tiles-grid">
        <!-- 1. Suika Fruit Merge -->
        <a href="suika-merge.html" class="tile-card" data-title="suika merge" data-cat="puzzle" style="background-image: url('cover_suika.jpg');">
          <span class="tile-tag">2P MERGE</span>
          <div class="tile-overlay"></div>
          <h2 class="tile-title">SUIKA<br>MERGE</h2>
        </a>

        <!-- 2. Block Puzzle Blitz -->
        <a href="block-puzzle.html" class="tile-card" data-title="block puzzle" data-cat="puzzle" style="background-image: url('cover_block.jpg');">
          <span class="tile-tag">PASS & PLAY</span>
          <div class="tile-overlay"></div>
          <h2 class="tile-title">BLOCK<br>PUZZLE</h2>
        </a>

        <!-- 3. Potato Bomb Duel -->
        <a href="potato-bomb.html" class="tile-card" data-title="potato bomb" data-cat="action" style="background-image: url('cover_potato.jpg');">
          <span class="tile-tag">VS BOMB</span>
          <div class="tile-overlay"></div>
          <h2 class="tile-title">POTATO<br>BOMB</h2>
        </a>

        <!-- 4. Tower Stacker -->
        <a href="tower-stacker.html" class="tile-card" data-title="tower stacker" data-cat="arcade" style="background-image: url('cover_tower.jpg');">
          <span class="tile-tag">BUILDER</span>
          <div class="tile-overlay"></div>
          <h2 class="tile-title">TOWER<br>STACKER</h2>
        </a>

        <!-- 5. Snake vs Snake -->
        <a href="snake-battle.html" class="tile-card" data-title="snake battle" data-cat="action" style="background-image: url('cover_snake.jpg');">
          <span class="tile-tag">ARENA</span>
          <div class="tile-overlay"></div>
          <h2 class="tile-title">SNAKE<br>BATTLE</h2>
        </a>

        <!-- 6. Memory Match -->
        <a href="memory-match.html" class="tile-card" data-title="memory match" data-cat="puzzle" style="background-image: url('cover_memory.jpg');">
          <span class="tile-tag">BRAIN</span>
          <div class="tile-overlay"></div>
          <h2 class="tile-title">MEMORY<br>MATCH</h2>
        </a>

        <!-- 7. Spot & Tap Emoji -->
        <a href="match-emoji.html" class="tile-card" data-title="spot emoji" data-cat="arcade" style="background-image: url('cover_emoji.jpg');">
          <span class="tile-tag">REFLEX</span>
          <div class="tile-overlay"></div>
          <h2 class="tile-title">SPOT<br>EMOJI</h2>
        </a>

        <!-- 8. Carrom Pool Clash -->
        <a href="carrom-pool.html" class="tile-card" data-title="carrom pool" data-cat="arcade" style="background-image: url('cover_carrom.jpg');">
          <span class="tile-tag">PHYSICS</span>
          <div class="tile-overlay"></div>
          <h2 class="tile-title">CARROM<br>POOL</h2>
        </a>

        <!-- 9. Color Wars -->
        <a href="color-wars.html" class="tile-card" data-title="color wars" data-cat="action" style="background-image: url('cover_color.jpg');">
          <span class="tile-tag">TERRITORY</span>
          <div class="tile-overlay"></div>
          <h2 class="tile-title">COLOR<br>WARS</h2>
        </a>

        <!-- 10. Dirt Rally Battle -->
        <a href="dirt-game.html" class="tile-card" data-title="dirt rally" data-cat="action" style="background-image: url('cover_dirt.jpg');">
          <span class="tile-tag">RALLY</span>
          <div class="tile-overlay"></div>
          <h2 class="tile-title">DIRT<br>RALLY</h2>
        </a>
      </div>
    </main>

    <!-- BOTTOM TOURNAMENT & PLAYER FOOTER BAR -->
    <footer class="bottom-player-bar">
      <!-- Player 1 Score Badge -->
      <div class="player-score-badge badge-p1">
        <span class="player-avatar-icon">🔴</span>
        <span>0</span>
      </div>

      <!-- Play Tournament Center Button -->
      <button class="tournament-btn" onclick="playTournament()">
        <span>🏆</span>
        <span>PLAY TOURNAMENT</span>
        <span>🏆</span>
      </button>

      <!-- Player 2 Score Badge -->
      <div class="player-score-badge badge-p2">
        <span class="player-avatar-icon">🔵</span>
        <span>0</span>
      </div>
    </footer>
  </div>

  <script>
    let soundEnabled = true;
    let currentCategory = 'all';

    /* Web Audio Synthesizer */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(750, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch(e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-btn');
      btn.textContent = soundEnabled ? '⚙️' : '🔇';
    }

    function selectCategory(cat, el) {
      playSound('click');
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(pill => pill.classList.remove('active'));
      el.classList.add('active');
      filterGames();
    }

    function filterGames() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      document.querySelectorAll('.tile-card').forEach(card => {
        const title = card.getAttribute('data-title') || '';
        const cat = card.getAttribute('data-cat') || '';
        const matchesSearch = title.includes(query);
        const matchesCat = currentCategory === 'all' || cat === currentCategory;

        if (matchesSearch && matchesCat) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function playTournament() {
      playSound('click');
      const games = [
        'suika-merge.html',
        'block-puzzle.html',
        'potato-bomb.html',
        'tower-stacker.html',
        'snake-battle.html',
        'memory-match.html',
        'carrom-pool.html'
      ];
      const randomGame = games[Math.floor(Math.random() * games.length)];
      window.location.href = randomGame;
    }

    document.querySelectorAll('.tile-card').forEach(card => {
      card.addEventListener('click', () => playSound('click'));
    });
  </script>
</body>
</html>
